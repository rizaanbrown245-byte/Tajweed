name: Build Android Debug APK

on:
push:
branches: [main, master]
pull_request:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build & Export Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Java JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'
      cache: npm
      cache-dependency-path: package-lock.json

  - name: Install NPM Dependencies
    run: |
      if [ -f package-lock.json ]; then
        npm ci --legacy-peer-deps
      else
        npm install --legacy-peer-deps
      fi

  - name: Build Web Production Assets
    run: npm run build

  - name: Copy Assets to Android WebView
    run: |
      test -d dist || (echo "ERROR: dist folder not found after build" && exit 1)
      mkdir -p android/app/src/main/assets/public
      cp -r dist/. android/app/src/main/assets/public/

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Verify Android SDK
    run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      adb version
      sdkmanager --version

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Verify Android Project
    run: |
      test -f android/gradlew || (echo "ERROR: android/gradlew is missing" && exit 1)
      test -f android/settings.gradle -o -f android/settings.gradle.kts || (echo "ERROR: Android Gradle settings file is missing" && exit 1)
      test -f android/app/build.gradle -o -f android/app/build.gradle.kts || (echo "ERROR: Android app Gradle file is missing" && exit 1)

  - name: Build Debug APK with Gradle
    working-directory: android
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug --stacktrace

  - name: Upload Debug APK as Artifact
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: TajweedAI-debug-apk
      path: android/app/build/outputs/apk/debug/*.apk
      retention-days: 30
      if-no-files-found: error
