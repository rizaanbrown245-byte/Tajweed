<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#emeraldGrad)"/>
  <!-- Islamic Geometric Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Stylized Quranic Book & Soundwave / Crescent -->
  <g transform="translate(256, 256)">
    <!-- Crescent Moon Accent -->
    <path d="M-60 -150 A 90 90 0 0 0 70 -60 A 110 110 0 0 1 -60 -150 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Open Book / Rihal Stand -->
    <!-- Left Page -->
    <path d="M-12 50 C -60 20, -140 30, -170 50 C -170 -60, -90 -80, -12 -50 Z" fill="#fcfaf6" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Right Page -->
    <path d="M12 50 C 60 20, 140 30, 170 50 C 170 -60, 90 -80, 12 -50 Z" fill="#fcfaf6" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Center Spine -->
    <path d="M0 -60 L 0 60" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Page text lines hint -->
    <line x1="-140" y1="-20" x2="-40" y2="-10" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="-140" y1="5" x2="-40" y2="15" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="40" y1="-10" x2="140" y2="-20" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="40" y1="15" x2="140" y2="5" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Acoustic / Sound Wave Arc representing Recitation Feedback -->
    <path d="M-70 100 C -30 120, 30 120, 70 100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M-100 125 C -40 155, 40 155, 100 125" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M-130 150 C -50 190, 50 190, 130 150" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
